[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core"
version = "0.1.0"
description = "English-learning domain core: services, DB, LLM/speech wrappers, prompts."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.40",
    # W2. core/passkeys.py imports it, so this file is its authority: `pip
    # install -e packages/core` — already step 3 of the deploy sequence —
    # installs it, and the sequence gains no new step. Declaring it only in
    # requirements.txt would leave `core` importing something it does not
    # declare. tests/test_core_boundary.py asserts the mirror agrees.
    "webauthn>=2.5,<3",
    # W5. `core/items/schema.py` parses an eleven-variant generator payload as a
    # discriminated union, so this file is its authority. It already arrives in
    # every venv transitively (via `anthropic`, and `apps/api` imports it
    # directly), so declaring it turns an undeclared transitive dependency into
    # a declared one -- a tightening, and the deploy sequence gains no step
    # because `pip install -e packages/core` is already step 3.
    "pydantic>=2.7,<3",
    # W7. `core/cards/fsrs.py` is the only module in the repository that imports
    # it, so this file is its authority. MIT-licensed, one runtime dependency
    # (`typing-extensions`), and the `optimizer` extra -- which would pull torch,
    # numpy and pandas -- is deliberately NOT installed. `pip install -e
    # packages/core` is already step 3 of the settled deploy sequence, so the
    # sequence gains no step.
    #
    # Pinned to the 6.x line, which implements FSRS-6 (21 parameters where
    # FSRS-5 had 19). `docs/PRD-v3-web.md` §5 said FSRS-5 and is corrected in the
    # same commit: the 5.x line is installable but unmaintained, and pinning the
    # deck's first day to it would buy a document match and cost a migration
    # slice later.
    "fsrs>=6.3.2,<7",
    # W12b. `core/video_api.py` is the ONLY module in `packages/core` that
    # imports it, and that file is exempted BY NAME in
    # tests/test_core_boundary.py -- every other file in core still fails on an
    # httpx import, which is the point of routing the video pipeline's HTTP
    # through one door the way `llm.py` and `speech.py` are the only doors to a
    # provider SDK.
    #
    # It already arrives in every venv transitively (via `anthropic`) and
    # `requirements.txt` has carried it since W3 for the ASGI test transport, so
    # declaring it here turns an undeclared transitive dependency into a declared
    # one -- a tightening. `pip install -e packages/core` is already step 3 of
    # the settled deploy sequence, so the sequence gains no step.
    "httpx>=0.27",
]

# `core` is this directory itself, so the package root maps to ".".
# Installing this package is what makes the CLAUDE.md §2 boundary a packaging
# fact rather than a path convention: apps/api, apps/worker and apps/bot must
# declare a dependency on it, and it can never depend on them.
[tool.setuptools]
# `core.lexicon` was shipped by W4 and never listed here. The editable install
# resolves it by filesystem path so nothing has failed, but a wheel build would
# have dropped the whole lexicon package. W5 adds `core.items` and would have
# walked into the same hole, so both are declared. W7 added `core.cards` and
# W8 `core.syllabus` in the same spirit: a package that only works because the
# install is editable is a package that vanishes the first time it is not.
# W12b adds `core.video` here in the same commit that creates it, rather than
# discovering at the first wheel build that it was never listed -- which is the
# exact hole this comment was written about after `core.lexicon` fell into it.
packages = ["core", "core.services", "core.lexicon", "core.items", "core.cards", "core.syllabus", "core.video"]

[tool.setuptools.package-dir]
core = "."
"core.services" = "services"

[tool.setuptools.package-data]
core = ["prompts/*.txt"]
